name: release

# Builds the downloadable apps and drafts a GitHub Release.
#
# A Mac cannot build the Windows executable and vice versa -- PyInstaller
# bundles the host platform's own Python runtime -- so this is the only place
# the pair gets built together.
#
# Free on a public repository. On a private one the macOS runner bills at ten
# times the Linux rate, so keep releases here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for a dry run without a tag)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: packaging/build_macos.sh

      # A build that produces a file and crashes on launch is worth nothing,
      # and nobody finds that out until somebody downloads it.
      - name: Smoke test the built app
        run: |
          export HEALTH_LEDGER_DATA_DIR="$RUNNER_TEMP/ledger"
          "dist/Health Ledger.app/Contents/MacOS/Health Ledger" \
            --no-browser --no-tray --port 5099 &
          pid=$!
          for i in $(seq 1 60); do
            sleep 1
            if curl -fsS -o /dev/null "http://127.0.0.1:5099/"; then
              echo "the app answered on attempt $i"; kill $pid; exit 0
            fi
          done
          echo "::error::the packaged app never answered on 127.0.0.1:5099"
          kill $pid 2>/dev/null; exit 1

      # The .icns inside the bundle is built on the runner. This proves it
      # still carries the drawing that was reviewed, by pixels rather than by
      # container bytes, which vary between macOS versions for identical
      # images.
      - name: The shipped icon is the committed one
        run: |
          python -m pip install --quiet pillow
          python packaging/verify_icon.py \
            "dist/Health Ledger.app/Contents/Resources/icon.icns" \
            packaging/icon.png

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        shell: pwsh
        run: packaging\build_windows.ps1

      # Nobody has run this build on Windows hardware. Until somebody does,
      # this is the only thing standing between a broken .exe and a release.
      - name: Smoke test the built executable
        shell: pwsh
        run: |
          $env:HEALTH_LEDGER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'ledger'
          $exe = Join-Path (Get-Location) 'dist\HealthLedger\HealthLedger.exe'
          $p = Start-Process -FilePath $exe `
            -ArgumentList '--no-browser','--no-tray','--port','5099' -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:5099/' -UseBasicParsing -TimeoutSec 2 | Out-Null
              Write-Host "the app answered on attempt $i"; $ok = $true; break
            } catch { }
          }
          if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { throw 'the packaged executable never answered on 127.0.0.1:5099' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

  draft:
    name: Draft the release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: What was built
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true            # look at it before the world does
          generate_release_notes: true
          files: artifacts/*
          body: |
            Health Ledger ${{ github.ref_name }}

            **Mac:** download the `.dmg`, drag the app to Applications, then
            **right-click the app and choose Open** the first time.

            **Windows:** download the `.zip`, unzip it, run `HealthLedger.exe`,
            and choose **More info → Run anyway** the first time.

            Neither build is code-signed, which is what those warnings are
            about. [INSTALL.md](INSTALL.md) explains them, and running from
            source is always an option.

            Your records stay on your own computer. Nothing is uploaded.
            Health Ledger is not a medical device and is not a substitute for
            professional medical advice.

            See [CHANGELOG.md](CHANGELOG.md) for what changed.
