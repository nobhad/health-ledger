{# Toolbar at the top of a document served to the browser for printing.
   Hidden when printing (print.css .no-print). Styled by pdf.css .print-toolbar. #}
<div class="print-toolbar no-print" role="region" aria-label="Print this document">
    <p>Print this page, or choose <strong>Save as PDF</strong> in the print window to keep a copy.{% if note %} {{ note }}{% endif %}</p>
    <button type="button" onclick="window.print()">Print or save as PDF</button>
    <a href="{{ back_url }}">Back</a>
</div>
